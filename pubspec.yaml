name: la_bonne_alternance
description: Application Flutter pour rechercher des offres d'alternance via l'API La Bonne Alternance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # Network
  dio: ^5.4.0
  
  # Data Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.2.0
  
  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # File Picker
  file_picker: ^6.1.1
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  html: ^0.15.4
  shimmer: ^3.0.0
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  
  # Lints
  very_good_analysis: ^5.1.0
  
  # Testing
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
