version: '3.8'

services:
  lba-app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./env.json:/app/env.json:ro
    environment:
      - FLUTTER_WEB_PORT=8080
    restart: unless-stopped

  # Service optionnel : serveur web statique (après build)
  lba-static:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
    restart: unless-stopped
    profiles:
      - static
