targets:
  $default:
    builders:
      freezed:
        options:
          copy_with: true
          equal: true
          to_json: true
          from_json: true
      json_serializable:
        options:
          any_map: false
          checked: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: true
          field_rename: snake_case
